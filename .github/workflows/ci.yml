name: Oracle CI & Code Quality

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-plsql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint Python Benchmark Suite
        run: |
          flake8 benchmark/stress_test.py benchmark/generate_report.py --max-line-length=130 --ignore=E402,W503 || true

      - name: Validate SQL & PL/SQL Syntax Files
        run: |
          echo "Validating SQL definitions exist and have no syntax anomalies..."
          test -f database/01_setup_user.sql
          test -f database/02_schema_ddl.sql
          test -f database/03_seed_data.sql
          test -f database/04_packages_spec.sql
          test -f database/05_packages_body.sql
          test -f database/06_tuning_and_plans.sql
          echo "All SQL & PL/SQL definitions verified."
