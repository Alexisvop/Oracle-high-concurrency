services:
  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: oracle-bank-db
    restart: unless-stopped
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: "BankAdminPassword123#"
      APP_USER: "BANK_USER"
      APP_USER_PASSWORD: "BankUserPassword123#"
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./database:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "/usr/local/bin/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle_data:
